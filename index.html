  <!-- Critical CSS for above-the-fold content -->
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }

    .hero-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }

      // Add loading spinner safe for head execution
      const injectLoading = () => {
        if (!document.body) return setTimeout(injectLoading, 10);
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'hero-loading';
        loadingDiv.innerHTML = '<div class="hero-loading-spinner"></div>';
        document.body.appendChild(loadingDiv);
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectLoading);
      } else {
        injectLoading();
      }

      // Remove loading spinner when React mounts
      window.addEventListener('load', () => {
        setTimeout(() => {
          const spinner = document.querySelector('.hero-loading');
          if (spinner) spinner.remove();
        }, 100);
      });
    })();
  </script>
